{% extends "layout.html" %}
{% block title %}Edit Service #{{ record.ServiceID }}{% endblock %}
{% block content %}
<h1>Edit Service Record #{{ record.ServiceID }}</h1>
<div class="card" style="max-width:640px">
<form method="POST">
    <div class="form-grid">
        <div>
            <label>Customer</label>
            <select name="cust_id" required>
                {% for c in customers %}
                <option value="{{ c.CustID }}" {{ 'selected' if c.CustID == record.CustID }}>{{ c.Name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label>Vehicle</label>
            <select name="vehicle_id" required>
                {% for v in vehicles %}
                <option value="{{ v.VehicleID }}" {{ 'selected' if v.VehicleID == record.VehicleID }}>
                    {{ v.Make }} {{ v.Model }} {{ v.Year }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label>Service Date</label>
            <input type="text" name="service_date" class="datepicker" value="{{ record.ServiceDate }}" placeholder="YYYY-MM-DD" required>
        </div>
        <div>
            <label>Service Cost ($)</label>
            <input type="number" name="service_price" step="0.01" value="{{ record.ServicePrice }}" min="0" required>
        </div>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="/service/{{ record.ServiceID }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
</div>
{% endblock %}
