{% extends "layout.html" %}
{% block title %}New Loan{% endblock %}
{% block content %}
<h1>Create Loan Record</h1>
<div class="card" style="max-width:720px">
<form method="POST">
    <div class="form-grid">
        <div>
            <label>Customer</label>
            <select name="cust_id" required>
                <option value="">— Select —</option>
                {% for c in customers %}
                <option value="{{ c.CustID }}">{{ c.Name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label>Vehicle</label>
            <select name="vehicle_id" required>
                <option value="">— Select —</option>
                {% for v in vehicles %}
                <option value="{{ v.VehicleID }}">{{ v.Make }} {{ v.Model }} {{ v.Year }} — ${{ "%.0f"|format(v.Price) }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label>Loan Amount ($)</label>
            <input type="number" name="loan_amount" step="0.01" min="0" required>
        </div>
        <div>
            <label>Interest Rate (%)</label>
            <input type="number" name="interest_rate" step="0.01" min="0" required>
        </div>
        <div>
            <label>Loan Term (months)</label>
            <input type="number" name="loan_term" min="1" required>
        </div>
        <div>
            <label>Monthly Payment ($)</label>
            <input type="number" name="monthly_payment" step="0.01" min="0" required>
        </div>
        <div>
            <label>Approval Status</label>
            <select name="approval_status" required>
                <option value="yes">Approved</option>
                <option value="no">Denied</option>
            </select>
        </div>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Loan</button>
        <a href="/loans" class="btn btn-secondary">Cancel</a>
    </div>
</form>
</div>
{% endblock %}
